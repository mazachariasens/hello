name: Hello World

on:
  push:

jobs:
  hello-world:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run container script
        run: ./container.sh

      - name: Run container script again
        run: ./container.sh

      - name: Build my Docker image
        run: docker build -t my-nginx-image .

      - name: Start my Docker container
        run: docker run -d --name my-web -p 8080:80 my-nginx-image

      - name: Wait for web server
        run: |
          for i in {1..10}; do
            if curl --fail http://localhost:8080; then
              exit 0
            fi
            sleep 2
          done
          docker logs my-web
          exit 1

      - name: Remove my Docker container
        if: always()
        run: docker rm -f my-web
